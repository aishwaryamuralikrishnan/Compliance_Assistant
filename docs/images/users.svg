<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .t{fill:#1f2937}
    .b{font-weight:700}
    .s{fill:#4b5563;font-size:11.5px}
    .lbl{fill:#6b7280;font-size:10px;letter-spacing:.06em}
    .cell{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .head{fill:#e5e7eb;stroke:#d1d5db;stroke-width:1}
  </style>
  <rect x="0" y="0" width="900" height="290" fill="#f4f5f8"/>

  <!-- header row -->
  <rect x="14" y="14" width="150" height="30" class="head"/>
  <text x="89" y="33" text-anchor="middle" class="lbl">TYPE OF USER</text>
  <rect x="164" y="14" width="220" height="30" class="head"/>
  <text x="274" y="33" text-anchor="middle" class="lbl">USER</text>
  <rect x="384" y="14" width="502" height="30" class="head"/>
  <text x="635" y="33" text-anchor="middle" class="lbl">TASKS</text>

  <!-- row 1: product manager (y 44..160) -->
  <rect x="14" y="44" width="150" height="116" class="cell"/>
  <text x="89" y="98" text-anchor="middle" class="t b">Primary</text>
  <text x="89" y="116" text-anchor="middle" class="s">asks</text>

  <rect x="164" y="44" width="220" height="116" class="cell"/>
  <circle cx="200" cy="92" r="11" fill="#1f5f8b"/>
  <path d="M182 124 a18 18 0 0 1 36 0" fill="#1f5f8b"/>
  <text x="226" y="96" class="t b">Product manager</text>
  <text x="226" y="113" class="s">describes features</text>
  <text x="226" y="128" class="s">in plain words</text>

  <rect x="384" y="44" width="502" height="116" class="cell"/>
  <text x="400" y="68" class="s">• Describes a feature and gets an assessment (worker agent)</text>
  <text x="400" y="88" class="s">• Asks a quick legal question and gets a cited answer</text>
  <text x="400" y="108" class="s">• Revises the feature when the DPO requests changes (reviser agent writes version 2)</text>
  <text x="400" y="128" class="s">• Leaves a note on how future assessments should look</text>
  <text x="400" y="148" class="s">• Reads the register and the memory</text>

  <!-- row 2: DPO (y 160..276) -->
  <rect x="14" y="160" width="150" height="116" class="cell"/>
  <text x="89" y="214" text-anchor="middle" class="t b">Secondary</text>
  <text x="89" y="232" text-anchor="middle" class="s">decides</text>

  <rect x="164" y="160" width="220" height="116" class="cell"/>
  <circle cx="200" cy="208" r="11" fill="#8a6d3b"/>
  <path d="M182 240 a18 18 0 0 1 36 0" fill="#8a6d3b"/>
  <text x="226" y="212" class="t b">Data Protection Officer</text>
  <text x="226" y="229" class="s">reviews and decides</text>
  <text x="226" y="244" class="s">on every assessment</text>

  <rect x="384" y="160" width="502" height="116" class="cell"/>
  <text x="400" y="184" class="s">• Amends an assessment if needed</text>
  <text x="400" y="204" class="s">• Approves it (register entry written), requests changes (back for revision) or rejects it</text>
  <text x="400" y="224" class="s">• Every decision is remembered for the next assessment</text>
  <text x="400" y="244" class="s">• Exports the register as a PDF for audits</text>
</svg>
