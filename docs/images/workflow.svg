<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .box{fill:#ffffff;stroke:#374151;stroke-width:1.2}
    .agent{stroke:#1f5f8b;stroke-width:2.2}
    .badge{fill:#1f5f8b}
    .bt{fill:#ffffff;font-size:9.5px;font-weight:700;letter-spacing:.05em}
    .pm{fill:#e8f0f7}
    .dpo{fill:#f3ecdf}
    .store{fill:#eaf2e9}
    .t{fill:#1f2937}
    .b{font-weight:700}
    .s{fill:#6b7280;font-size:10.5px}
    .lane{fill:#6b7280;font-size:10px;letter-spacing:.06em}
    .edge{fill:none;stroke:#374151;stroke-width:1.4}
    .edge.blue{stroke:#1f5f8b;stroke-width:2}
    .edge.orange{stroke:#b45309;stroke-width:2}
    .edge.dash{stroke-dasharray:5 4}
    .el{fill:#1f5f8b;font-size:10.5px}
    .eo{fill:#b45309;font-size:10.5px}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f5f8b"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="356" fill="#f4f5f8"/>

  <!-- lanes -->
  <rect x="14" y="12" width="972" height="110" rx="8" class="pm" stroke="#d1d5db"/>
  <text x="26" y="28" class="lane">PRODUCT MANAGER · Assistant page</text>
  <rect x="14" y="130" width="972" height="96" rx="8" class="dpo" stroke="#d1d5db"/>
  <text x="26" y="146" class="lane">DATA PROTECTION OFFICER · Review queue</text>
  <rect x="14" y="234" width="972" height="110" rx="8" class="store" stroke="#d1d5db"/>
  <text x="26" y="250" class="lane">RECORDS · processing register and long-term memory</text>

  <!-- PM lane: boxes y 46..106 -->
  <rect x="30" y="46" width="170" height="60" rx="6" class="box"/>
  <text x="115" y="70" text-anchor="middle" class="t b">1 · Describe the feature</text>
  <text x="115" y="88" text-anchor="middle" class="s">in plain words</text>

  <rect x="240" y="46" width="190" height="60" rx="6" class="box agent"/>
  <rect x="290" y="38" width="90" height="16" rx="8" class="badge"/>
  <text x="335" y="49.5" text-anchor="middle" class="bt">WORKER AGENT</text>
  <text x="335" y="76" text-anchor="middle" class="t b">2 · Read the assessment</text>
  <text x="335" y="93" text-anchor="middle" class="s">verdict · findings · flags</text>

  <rect x="470" y="46" width="250" height="60" rx="6" class="box agent"/>
  <rect x="550" y="38" width="90" height="16" rx="8" class="badge"/>
  <text x="595" y="49.5" text-anchor="middle" class="bt">REVISER AGENT</text>
  <text x="595" y="72" text-anchor="middle" class="t b">5 · Revise if changes requested</text>
  <text x="595" y="87" text-anchor="middle" class="s">answer each request · edit the description</text>
  <text x="595" y="100" text-anchor="middle" class="s">run again → version 2</text>

  <rect x="790" y="46" width="180" height="60" rx="6" class="box"/>
  <text x="880" y="70" text-anchor="middle" class="t b">7 · Next assessment</text>
  <text x="880" y="88" text-anchor="middle" class="s">uses lessons and preferences</text>

  <!-- DPO lane: boxes y 160..216 -->
  <rect x="240" y="160" width="190" height="56" rx="6" class="box"/>
  <text x="335" y="183" text-anchor="middle" class="t b">3 · Request arrives</text>
  <text x="335" y="200" text-anchor="middle" class="s">automatically, no button</text>

  <rect x="470" y="160" width="250" height="56" rx="6" class="box"/>
  <text x="595" y="183" text-anchor="middle" class="t b">4 · Approve · request changes · reject</text>
  <text x="595" y="200" text-anchor="middle" class="s">amend first if needed</text>

  <!-- Records lane: boxes y 270..326 -->
  <rect x="470" y="270" width="250" height="56" rx="6" class="box"/>
  <text x="595" y="293" text-anchor="middle" class="t b">6a · Register entry</text>
  <text x="595" y="310" text-anchor="middle" class="s">on approval only · PDF export for audits</text>

  <rect x="750" y="270" width="220" height="56" rx="6" class="box"/>
  <text x="860" y="293" text-anchor="middle" class="t b">6b · Memory</text>
  <text x="860" y="310" text-anchor="middle" class="s">DPO lessons · PM preferences</text>

  <!-- edges -->
  <!-- 1 -> 2 -->
  <line x1="200" y1="76" x2="240" y2="76" class="edge" marker-end="url(#a)"/>
  <!-- 2 -> 3: sent to the DPO -->
  <line x1="335" y1="106" x2="335" y2="160" class="edge blue" marker-end="url(#ab)"/>
  <text x="327" y="137" class="el" text-anchor="end">sent to the DPO</text>
  <!-- 3 -> 4 -->
  <line x1="430" y1="188" x2="470" y2="188" class="edge" marker-end="url(#a)"/>
  <!-- 4 -> 5: request changes -->
  <line x1="530" y1="160" x2="530" y2="106" class="edge orange" marker-end="url(#ao)"/>
  <text x="522" y="137" class="eo" text-anchor="end">request changes</text>
  <!-- 5 -> 4: version 2 to the DPO -->
  <line x1="660" y1="106" x2="660" y2="160" class="edge blue" marker-end="url(#ab)"/>
  <text x="668" y="137" class="el">version 2 to the DPO</text>
  <!-- 4 -> 6a: approve -->
  <line x1="530" y1="216" x2="530" y2="270" class="edge blue" marker-end="url(#ab)"/>
  <text x="522" y="247" class="el" text-anchor="end">approve</text>
  <!-- 4 -> 6b: every decision -->
  <polyline points="660,216 660,246 840,246 840,270" class="edge blue" marker-end="url(#ab)"/>
  <text x="750" y="241" class="el" text-anchor="middle">every decision</text>
  <!-- 6b -> 7: read next time -->
  <line x1="920" y1="270" x2="920" y2="106" class="edge blue dash" marker-end="url(#ab)"/>
  <text x="912" y="190" class="el" text-anchor="end">read next time</text>
</svg>
